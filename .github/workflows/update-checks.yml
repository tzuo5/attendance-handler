name: macOS update acceptance
on:
  pull_request:
  push:
    branches: [main, codex/github-site-updates]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ATTENDANCE_UNIVERSAL: '1'
      - run: npm run test:update-native
        timeout-minutes: 12
